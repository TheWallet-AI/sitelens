name: Bug report
description: Report an unexpected result or behavior.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Do not include secrets or private website content.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and runtime
